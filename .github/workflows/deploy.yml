name: Test and deploy (GitHub Pages demo + Cloudflare live site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Affiliate link templates (public). Set in GitHub → Settings → Secrets and variables → Actions → Variables.
      VITE_PARTNER_LINKS: ${{ vars.VITE_PARTNER_LINKS }}
      # Public contact address shown on the privacy and terms pages.
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Static demo: the search engine and mock prices run in the browser, no API server.
      - run: npm run build:demo -w @farescope/web
      # Static "When to visit" guide pages + sitemap.xml, from cached data in data/guides/raw (no network).
      - run: npm run guides:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Live site on Cloudflare (real prices). Skipped until the CLOUDFLARE_API_TOKEN secret exists.
  # Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Variables: CF_SITE_URL (e.g.
  # https://tripica.<account>.workers.dev), VITE_TURNSTILE_SITE_KEY. Worker secrets (SERPAPI_KEY,
  # TURNSTILE_SECRET_KEY) live in Cloudflare, set once with `npx wrangler secret put`.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      - run: npm run build:cf
        if: env.HAS_TOKEN == 'true'
        env:
          TRIPICA_LIVE_BUILD: "true"
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          SITE_URL: ${{ vars.CF_SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PARTNER_LINKS: ${{ vars.VITE_PARTNER_LINKS }}
      - run: npx wrangler deploy
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
